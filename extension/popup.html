<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>铁花dsh浏览器助手</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { width: 360px; margin: 0; padding: 20px; font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: #24334a; background: linear-gradient(145deg, #eef4ff 0%, #f8faff 45%, #f7f9fc 100%); }
    .brand { display: flex; align-items: center; gap: 11px; margin: 0 0 20px; }
    .brand-icon { display: block; width: 44px; height: 44px; flex-shrink: 0; }
    h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.35px; color: #192b47; }
    #state { padding: 17px 18px 15px; background: #fff; border: 1px solid #e2e9f4; border-radius: 16px; box-shadow: 0 3px 12px #244d8910, 0 1px 2px #244d8905; }
    .status-heading { display: flex; align-items: center; gap: 9px; }
    .connection-icon { display: grid; place-items: center; width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; color: #718199; background: #f0f4f8; }
    .connection-icon svg { width: 17px; height: 17px; }
    .connected-icon { display: none; }
    #state[data-connected="true"] .connection-icon { color: #16915a; background: #e8f8ef; }
    #state[data-connected="true"] .connected-icon { display: block; }
    #state[data-connected="true"] .disconnected-icon { display: none; }
    #state[data-connected="true"] #status-label { color: #14794d; }
    #status-label { font-size: 14px; font-weight: 600; }
    #connection-details { display: grid; gap: 11px; margin-top: 15px; padding-top: 14px; border-top: 1px solid #edf1f6; }
    .detail-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .detail-label { color: #7a879a; font-size: 12px; flex-shrink: 0; }
    #endpoint { padding: 3px 7px; border: 1px solid #eaf0fb; border-radius: 6px; background: #f5f8ff; color: #3c5f99; font: 12px/1.4 Consolas, "SFMono-Regular", monospace; font-variant-numeric: tabular-nums; }
    #version { color: #65738a; font: 12px/1.5 Consolas, "SFMono-Regular", monospace; overflow-wrap: anywhere; text-align: right; }
    #status-detail { margin: 12px 0 0 37px; color: #7a879a; font-size: 12px; }
  </style>
</head>
<body>
  <header class="brand">
    <img class="brand-icon" src="icons/tiehua128.png" width="44" height="44" alt="">
    <h1>铁花dsh浏览器助手</h1>
  </header>
  <section id="state" role="status" aria-live="polite" aria-label="DSH 连接状态" data-connected="false">
    <div class="status-heading">
      <span class="connection-icon" aria-hidden="true">
        <svg class="connected-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
        <svg class="disconnected-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </span>
      <div id="status-label">正在检查连接…</div>
    </div>
    <div id="connection-details" hidden>
      <div class="detail-row" id="endpoint-row" hidden><span class="detail-label">连接地址</span><code id="endpoint"></code></div>
      <div class="detail-row" id="version-row" hidden><span class="detail-label">插件版本</span><span id="version"></span></div>
    </div>
    <p id="status-detail" hidden></p>
  </section>
  <script type="module" src="popup.js"></script>
</body>
</html>
